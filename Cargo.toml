[package]
name = "tokio-lsp-client"
version = "0.0.1"
edition = "2024"
rust-version = "1.88.0"

authors = ["Ryan Maber <ryan@ryanmaber.com>"]
license = "MIT"
description = "A client for communicating asynchronously with language servers, fully compliant with v3.18.0 of the LSP specification, with support for streamed results, automatic cancellation, and much more."
keywords = ["lsp", "langauage-server", "client", "async", "tokio"]
categories = ["asynchronous", "api-bindings", "network-programming", "parser-implementations"]
readme = "README.md"

homepage = "https://ryanmaber.com"
repository = "https://github.com/ryanmab/tokio-lsp-client"

[badges]
maintenance = { status = "passively-maintained" }

[dependencies]
log = "0.4.28"
lsp-types = { version = "0.97.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
test-log = "0.2.21"
tokio-test = "0.4.6"
rstest = "0.27.0"
